[package]
name = "alan-desktop"
version = "1.1.0"
description = "A local-first Windows desktop todo widget"
authors = ["Alan Floyd"]
license = "MIT"
edition = "2021"

[lib]
name = "alan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[features]
# Serve the embedded frontend through the `tauri://localhost` asset protocol
# instead of navigating to `build.devUrl`.
#
# Tauri's build script derives its whole dev/production split from this feature:
#     let custom_protocol = has_feature("custom-protocol");
#     let dev = !custom_protocol;
# so a build without it is a *dev* build no matter which cargo profile was used.
#
# This must stay NOT default. Cargo features are profile-agnostic, so making it
# default would also flip `tauri dev` onto the embedded assets and break the dev
# server / HMR path. It is supplied explicitly, exactly as `tauri build` does:
#     cargo build --release --features custom-protocol
# `build.rs` cannot add it: a build script may only enable features of its own
# package, never a dependency feature such as `tauri/custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
# QA-only bootstrap override: lets the product binary resolve the maintenance
# QA sandbox (DTW_MAINTENANCE_QA_ID) so isolated bootstrap round-trips can run
# the real admission path without touching the production canonical roots.
# Never enabled for release/packaging builds.
maintenance-qa = ["desktop-todo-maintenance/qa"]

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
wry = "0.55.1"
# Shared maintenance core: canonical roots, receipt codec and the launch
# admission/lease primitives. No Tauri, network or SQLite dependency.
desktop-todo-maintenance = { path = "maintenance" }
# Pure signed-update protocol core (Phase 2B): envelope/trust-store/canonical
# signature verification, manifest parsing, candidate policy. Shared with the
# helper through the same path crate; each binary verifies independently.
desktop-todo-update-core = { path = "update-core" }
# This is the Standard product's whole Win32 surface: the widget-frame
# subclassing and window styles plus the WebView2 telemetry in qa_diagnostics.
# `Win32_UI_Shell` is declared explicitly instead of relying on feature
# unification from other crates in the dependency graph.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"

[target.'cfg(windows)'.dev-dependencies]
# The `qa` feature exists only so admission tests can build sandbox Paths
# under the repository target directory. Dev-dependency features never reach
# a production build, so shipped binaries cannot be redirected by the QA
# environment variable.
desktop-todo-maintenance = { path = "maintenance", features = ["qa"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
