[package]
name = "alan-desktop"
version = "0.1.0"
description = "Alan Desktop local-first productivity widget"
authors = ["Alan Floyd"]
license = "MIT"
edition = "2021"

[lib]
name = "alan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
